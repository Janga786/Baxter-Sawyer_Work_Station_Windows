version: '3.8'
services:
  baxter_station:
    build: .
    container_name: baxter_station
    ports:
      - "8080:8080" # Expose a port for a potential web interface
    volumes:
      - .:/home/baxter/baxter_station
    environment:
      - DISPLAY=${DISPLAY}
    extra_hosts:
      - "baxter.local:192.168.42.2"
